services:
  # ─── ChromaDB — persistent vector store ───────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis — Celery broker + result backend + BM25 staleness flag ──────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── RAG API server ───────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro   # read-only at serve time
      - ./data/chroma_db:/app/data/chroma_db           # shared with ingestion
    environment:
      MODEL: ${MODEL:-gemini/gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8001
      COLLECTION_NAME: prod_rag
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Celery worker — async ingestion pipeline ─────────────────────────────
  worker:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      MODEL: ${MODEL:-gemini/gemini-2.0-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8001
      COLLECTION_NAME: prod_rag
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A src.ingestion.tasks worker
        --loglevel=info
        --queues=ingestion
        --concurrency=2
        --max-tasks-per-child=50
    restart: unless-stopped

  # ─── Flower — Celery monitoring UI (open http://localhost:5555) ───────────
  flower:
    image: mher/flower:2.0
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    depends_on:
      redis:
        condition: service_healthy

volumes:
  chroma_data:
  redis_data:
