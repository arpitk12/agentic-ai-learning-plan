# SOLUTION — Exercise 3: CI/CD Pipeline for Agentic AI
# This is the completed version of ex3_ci_pipeline.yml
# Copy to .github/workflows/eval.yml in your repo root.
#
# Changes from the exercise version:
#   ✅ Added pip cache step
#   ✅ Added nightly cron schedule
#   ✅ Added threshold-check step (fails if score < 0.70)
#   ✅ Added multi-model matrix job (uncommented)

name: Agent Evaluation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  MODEL: "gemini/gemini-2.0-flash"

jobs:
  unit-tests:
    name: Unit Tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-json-report

      - name: Run unit tests (non-LLM)
        run: |
          pytest -v -k "not llm_judged" --tb=short \
            phase5_advanced/week10_evaluation/exercises/sol4_pytest_agent.py

  eval-suite:
    name: LLM Evaluation Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-json-report

      - name: Create .env file
        run: |
          echo "MODEL=${{ env.MODEL }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Run golden dataset baseline
        run: |
          python phase5_advanced/week10_evaluation/exercises/solutions/sol1_golden_dataset.py \
            2>&1 | tee eval_golden.txt

      - name: Run LLM judge evaluation
        run: |
          python phase5_advanced/week10_evaluation/exercises/solutions/sol2_llm_judge.py \
            2>&1 | tee eval_judge.txt

      - name: Run pytest regression suite
        run: |
          pytest phase5_advanced/week10_evaluation/exercises/solutions/sol4_pytest_agent.py \
            -v --tb=short --json-report --json-report-file=pytest_results.json \
            2>&1 | tee eval_pytest.txt || true

      - name: Check eval thresholds
        run: |
          python - <<'EOF'
          import json, sys, re

          # Parse accuracy from golden dataset output
          with open("eval_golden.txt") as f:
              content = f.read()

          match = re.search(r'Baseline accuracy: \d+/\d+ = ([\d.]+)%', content)
          if match:
              accuracy = float(match.group(1)) / 100
              print(f"Baseline accuracy: {accuracy:.1%}")
              if accuracy < 0.70:
                  print(f"❌ Accuracy {accuracy:.1%} below threshold 70%")
                  sys.exit(1)
              else:
                  print(f"✅ Accuracy {accuracy:.1%} meets threshold")
          else:
              print("Could not parse accuracy — skipping threshold check")
          EOF

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: |
            eval_golden.txt
            eval_judge.txt
            eval_pytest.txt
            pytest_results.json
          retention-days: 30

      - name: Post PR comment with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const golden = fs.existsSync('eval_golden.txt')
              ? fs.readFileSync('eval_golden.txt', 'utf8').slice(-800)
              : 'Not available';
            const body = `## 🤖 Evaluation Results\n\n\`\`\`\n${golden}\n\`\`\`\n\n[Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # Multi-model matrix — tests across multiple providers
  multi-model:
    name: Multi-Model Eval (${{ matrix.model }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        model:
          - "gemini/gemini-2.0-flash"
          - "openai/gpt-4o-mini"
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: pip install -r requirements.txt
      - name: Create .env
        run: |
          echo "MODEL=${{ matrix.model }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
      - name: Run golden dataset
        run: |
          python phase5_advanced/week10_evaluation/exercises/solutions/sol1_golden_dataset.py \
            2>&1 | tee eval_${{ strategy.job-index }}.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
